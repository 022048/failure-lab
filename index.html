<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>실패 연구소 · 과학 사건 조사국</title>
<style>
:root{
  --bg:#0d1117; --panel:#151c26; --panel2:#1c2633; --line:#2b3949;
  --text:#eef4f8; --muted:#9aabba; --accent:#7dd3fc; --good:#65d69a;
  --bad:#ff8d8d; --yellow:#f5d36b;
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% -10%,#1b3344 0,#0d1117 45%);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{min-height:100vh}
.topbar{height:64px;display:flex;align-items:center;gap:18px;padding:0 22px;border-bottom:1px solid var(--line);background:#10161fdd;backdrop-filter:blur(8px);position:sticky;top:0;z-index:10}
.logo{font-size:28px}.brand b{display:block;font-size:17px}.brand span{font-size:11px;color:var(--muted)}
.spacer{flex:1}.hud{display:flex;gap:8px;flex-wrap:wrap}.pill{padding:7px 11px;border:1px solid var(--line);border-radius:999px;background:#121a24;font-size:12px;color:var(--muted)}.pill b{color:var(--text)}
.screen{max-width:1180px;margin:0 auto;padding:26px 20px}
.hidden{display:none!important}
.hero{padding:38px 0 24px;text-align:center}.hero .big{font-size:64px}.hero h1{font-size:42px;margin:8px 0}.hero p{color:var(--muted);max-width:650px;margin:0 auto;line-height:1.8}
.btn{border:1px solid var(--line);background:#182331;padding:12px 17px;border-radius:12px;cursor:pointer;transition:.15s}.btn:hover{transform:translateY(-1px);background:#213043}.btn.primary{background:#2b5870;border-color:#4e91b3}.btn.good{background:#214a3b;border-color:#3e896b}.btn.ghost{background:transparent}
.actions{display:flex;gap:10px;justify-content:center;margin-top:24px;flex-wrap:wrap}

.map-wrap{display:grid;grid-template-columns:1fr 280px;gap:16px}
.map{position:relative;min-height:620px;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:
linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px),
linear-gradient(145deg,#1a2630,#10161e 65%);background-size:40px 40px,40px 40px,auto}
.map-title{position:absolute;left:20px;top:18px;color:var(--muted);font-size:12px;letter-spacing:1px}
.room{position:absolute;width:210px;min-height:125px;border:1px solid #3a4d60;border-radius:16px;background:#17212cdd;padding:15px;text-align:left;cursor:pointer;box-shadow:0 10px 30px #0005}
.room:hover{border-color:var(--accent);transform:translateY(-2px)}.room h3{margin:6px 0 5px}.room p{margin:0;color:var(--muted);font-size:12px;line-height:1.5}
.r1{left:5%;top:12%}.r2{right:5%;top:12%}.r3{left:5%;bottom:10%}.r4{right:5%;bottom:10%}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:var(--muted)}
.player{position:absolute;left:50%;top:50%;width:44px;height:44px;border-radius:12px;background:#dcefff;color:#10202b;display:flex;align-items:center;justify-content:center;font-size:23px;box-shadow:0 8px 20px #0008;z-index:3;transition:left .08s,top .08s}
.map-note{position:absolute;left:50%;bottom:15px;transform:translateX(-50%);font-size:11px;color:var(--muted);white-space:nowrap}
.side{display:flex;flex-direction:column;gap:12px}.panel{border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:16px}.panel h2,.panel h3{margin:0 0 10px}.panel p{color:var(--muted);font-size:13px;line-height:1.6}.key{display:grid;grid-template-columns:1fr 1fr;gap:8px}.key button{min-height:42px}
.dialogue{border:1px solid var(--line);background:#101821;border-radius:16px;padding:18px;margin-top:16px;box-shadow:0 14px 30px #0005}
.speaker{color:var(--accent);font-size:12px;font-weight:700;margin-bottom:7px}.dialogue .text{line-height:1.75}.choices{display:grid;gap:8px;margin-top:14px}.choice{text-align:left;padding:12px;border:1px solid var(--line);background:#17222e;border-radius:11px;cursor:pointer}.choice:hover{border-color:var(--accent)}

.case-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.case-head h1{margin:0}.tag{font-size:11px;padding:5px 9px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}
.case-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:18px}.case-card{padding:18px;border:1px solid var(--line);background:var(--panel);border-radius:15px;cursor:pointer;text-align:left}.case-card:hover{border-color:var(--accent)}.case-card small{color:var(--muted)}.case-card h3{margin:7px 0}
.incident{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;margin-top:18px}.clues{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.clue{border:1px solid var(--line);background:#131c26;border-radius:13px;padding:13px;cursor:pointer;text-align:left}.clue.found{border-color:#557b91;background:#182833}.clue b{display:block;margin-bottom:5px}.clue span{font-size:12px;color:var(--muted);line-height:1.5}
.box{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:18px}.box h2{margin-top:0}.box p{color:var(--muted);line-height:1.7}.progress{height:8px;background:#0d141c;border-radius:999px;overflow:hidden}.progress i{display:block;height:100%;background:var(--accent);width:0;transition:.2s}
.hypotheses{display:grid;gap:9px}.hyp{padding:13px;text-align:left;border:1px solid var(--line);background:#17222e;border-radius:11px;cursor:pointer}.hyp:hover{border-color:var(--accent)}.hyp.selected{border-color:var(--accent);background:#203646}
.result{margin-top:14px;padding:15px;border-radius:13px;background:#101820;border:1px solid var(--line);line-height:1.7}.result.good{border-color:#39775c}.result.bad{border-color:#774646}
.experiment{display:grid;grid-template-columns:1fr 1fr;gap:12px}.meter{height:18px;background:#0b1117;border-radius:999px;border:1px solid var(--line);overflow:hidden}.meter i{display:block;height:100%;width:20%;background:var(--accent);transition:.5s}.readout{font-size:28px;font-weight:800;margin:12px 0}
.report{border-left:4px solid var(--accent);padding:14px 18px;background:#121c25;border-radius:0 13px 13px 0;line-height:1.8}
.toast{position:fixed;right:18px;bottom:18px;padding:12px 15px;border:1px solid var(--line);background:#101820;box-shadow:0 12px 30px #0008;border-radius:12px;z-index:20}
.mobile-controls{display:none}
@media(max-width:820px){
  .map-wrap,.incident{grid-template-columns:1fr}.case-grid{grid-template-columns:1fr}.experiment{grid-template-columns:1fr}
  .map{min-height:520px}.room{width:160px}.r1,.r2{top:14%}.r3,.r4{bottom:14%}
  .mobile-controls{display:grid;grid-template-columns:repeat(3,50px);justify-content:center;gap:6px;margin-top:10px}.mobile-controls button{height:45px}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast hidden"></div>

<script>
const CASES = [
  {
    id:"tacoma", lab:"공학", icon:"⚙️", year:"1940", title:"타코마 내로우즈교 붕괴",
    intro:"완공된 지 얼마 지나지 않은 현수교에서 강한 비틀림 진동이 관찰되었다. 조사팀은 바람, 구조 형상, 진동 기록을 비교해야 한다.",
    clues:[
      ["🌬️","바람 기록","바람은 있었지만 단순히 '강한 바람'만으로 설명하기 어려운 진동 패턴이 나타났다."],
      ["🌉","교량 형상","상판이 바람에 대한 공기역학적 거동을 충분히 고려하지 못한 형태였다."],
      ["📈","진동 기록","상하 운동과 비틀림 운동이 점점 커지는 기록이 남아 있다."],
      ["🎥","현장 영상","상판이 한쪽으로 기울어졌다가 반대쪽으로 돌아오는 비틀림 운동이 보인다."]
    ],
    hypotheses:[
      ["단순한 강풍이 모든 것을 일으켰다",false],
      ["상판과 바람의 상호작용으로 비틀림 진동이 커졌다",true],
      ["지진이 직접 붕괴를 일으켰다",false]
    ],
    explain:"역사적 사건의 핵심은 바람과 유연한 구조의 상호작용으로 비틀림 진동이 커진 현상이다. 이 사건은 구조공학과 유체역학을 함께 생각하게 해 준다.",
    experiment:"풍동 모형에서 바람의 세기를 조금씩 바꾸며 상판의 진동 변화를 관찰한다."
  },
  {
    id:"apollo13", lab:"공학", icon:"🚀", year:"1970", title:"아폴로 13호 산소 탱크 사고",
    intro:"우주비행 임무 도중 중요한 장비에 문제가 발생했다. 조사팀은 지상 준비 과정, 장비 상태, 운용 과정의 기록을 함께 살펴야 한다.",
    clues:[
      ["📋","정비 기록","발사 전에 장비와 관련된 이상 징후가 있었음을 보여 주는 기록이 있다."],
      ["🔌","전기 계통","장비의 전기적 문제가 이후 사건과 연결된다."],
      ["🧰","지상 작업","발사 전 작업 과정에서 충분히 확인되지 않은 문제가 있었다."],
      ["🛰️","임무 기록","문제 발생 후 여러 시스템을 이용해 임무를 안전하게 종료했다."]
    ],
    hypotheses:[
      ["우주에서 갑자기 생긴 완전히 새로운 문제였다",false],
      ["지상에서 발생한 장비 문제와 준비 과정이 중요한 원인이었다",true],
      ["태양풍이 직접 장비를 파괴했다",false]
    ],
    explain:"이 사례는 복잡한 시스템에서 '부품 하나'만 보는 것이 아니라 정비 기록, 시험, 작업 절차와 운용을 함께 보는 시스템 사고가 중요하다는 점을 보여 준다.",
    experiment:"가상의 시스템 블록을 연결하고, 한 부품의 상태가 전체 시스템에 어떤 영향을 주는지 확인한다."
  },
  {
    id:"chem-process", lab:"화학", icon:"🧪", year:"산업 안전", title:"공정 사고의 원인 찾기",
    intro:"한 산업 공정에서 예상하지 못한 이상 상태가 발생했다. 연구팀은 물질 자체뿐 아니라 센서, 경보, 절차와 사람의 판단까지 조사한다.",
    clues:[
      ["🌡️","센서 기록","공정 상태가 정상 범위를 벗어나는 변화가 먼저 기록되었다."],
      ["🚨","경보 기록","경보가 발생했지만 대응 과정이 충분히 연결되지 않았다."],
      ["📑","절차서","여러 단계의 대응 절차가 서로 잘 연결되어 있지 않았다."],
      ["👥","인수인계","교대 과정에서 중요한 정보가 정확히 전달되지 않은 정황이 있다."]
    ],
    hypotheses:[
      ["물질의 성질 하나만이 모든 원인이었다",false],
      ["기술적 이상과 감시·절차·의사소통 문제가 함께 작용했다",true],
      ["센서 숫자는 모두 오류였으므로 무시하면 됐다",false]
    ],
    explain:"실제 공정 안전에서는 화학적 성질과 장비뿐 아니라 센서, 경보, 절차, 교육, 의사소통을 함께 분석한다. 여기서는 위험한 물질을 다루는 방법이 아니라 사고 원인을 시스템 관점에서 분석한다.",
    experiment:"가상 공정의 센서·경보·절차 카드를 연결해 어떤 정보가 끊기는지 찾아낸다."
  },
  {
    id:"chem-battery", lab:"화학", icon:"🔋", year:"현대", title:"배터리 성능 저하 조사",
    intro:"같은 배터리인데 사용 시간이 점점 짧아진다는 보고가 들어왔다. 온도, 사용 패턴, 내부 저항과 충전 기록을 비교한다.",
    clues:[
      ["🌡️","온도","사용 환경의 온도 변화가 기록되어 있다."],
      ["🔌","충전 기록","충전 횟수와 시간이 누적되어 있다."],
      ["📉","출력 기록","시간이 지나면서 같은 조건에서 출력 특성이 달라졌다."],
      ["🧪","재료 기록","배터리 내부의 화학적 변화 가능성이 조사 대상이다."]
    ],
    hypotheses:[
      ["화면 밝기 하나가 모든 성능 저하의 원인이다",false],
      ["사용·온도·충방전 이력과 내부 화학 변화가 함께 영향을 준다",true],
      ["배터리는 시간이 지나도 성질이 변하지 않는다",false]
    ],
    explain:"배터리 성능은 하나의 변수로 결정되지 않는다. 사용 조건과 온도, 충방전 이력, 내부 화학 변화 등을 함께 살펴야 한다.",
    experiment:"가상 배터리 모델에서 조건 카드를 바꾸고 성능 지표의 변화를 비교한다."
  },
  {
    id:"bio-gene", lab:"생물", icon:"🧬", year:"연구 사례", title:"유전자 치료 연구의 실패 원인",
    intro:"연구팀은 세포에서 원하는 변화가 충분히 나타나지 않는 이유를 조사한다. 전달 효율, 표적 세포, 측정 방법을 구분해 생각해야 한다.",
    clues:[
      ["🧬","표적","원하는 세포에서 변화가 실제로 일어났는지 확인해야 한다."],
      ["📊","측정","실험 결과를 측정하는 방법 자체도 검토 대상이다."],
      ["🧫","세포 상태","세포의 상태와 조건에 따라 결과가 달라질 수 있다."],
      ["🔬","대조군","대조군과 비교해야 변화의 원인을 구분할 수 있다."]
    ],
    hypotheses:[
      ["결과가 기대와 다르면 무조건 유전자가 틀린 것이다",false],
      ["전달·표적·측정·대조군을 나누어 원인을 검증해야 한다",true],
      ["한 번의 측정만으로 원인을 확정할 수 있다",false]
    ],
    explain:"생물학 연구에서는 복잡한 원인을 한 번에 단정하지 않고 변수와 대조군을 나누어 검증하는 것이 중요하다.",
    experiment:"가상 실험에서 대조군과 조건을 선택하고 결과가 어떻게 달라지는지 비교한다."
  },
  {
    id:"bio-ecosystem", lab:"생물", icon:"🌱", year:"생태", title:"호수 생태계 변화 조사",
    intro:"한 호수에서 일부 생물의 개체 수가 달라졌다는 관찰이 들어왔다. 연구팀은 먹이망, 환경 조건, 계절성을 함께 조사한다.",
    clues:[
      ["🌊","수질","시간에 따라 물의 상태가 달라진 기록이 있다."],
      ["🐟","개체 수","여러 종의 변화가 동시에 관찰되었다."],
      ["🌤️","계절","계절에 따른 환경 변화가 있다."],
      ["🕸️","먹이망","한 종의 변화가 다른 종에 연쇄적으로 영향을 줄 수 있다."]
    ],
    hypotheses:[
      ["한 종만의 변화가 모든 것을 설명한다",false],
      ["환경 조건과 종 사이의 상호작용을 함께 봐야 한다",true],
      ["계절은 생태계에 영향을 주지 않는다",false]
    ],
    explain:"생태계는 여러 종과 환경이 서로 연결된 시스템이다. 원인을 찾을 때도 단일 변수보다 상호작용과 시간 변화를 함께 살펴야 한다.",
    experiment:"가상 먹이망에서 한 조건을 바꾸고 여러 종의 변화를 관찰한다."
  },
  {
    id:"phys-motion", lab:"물리", icon:"⚛️", year:"고전역학", title:"예상과 다른 운동",
    intro:"실험실의 수레가 예상한 거리만큼 움직이지 않았다. 힘, 질량, 마찰, 측정 오차를 구분해야 한다.",
    clues:[
      ["🛒","수레","수레의 질량과 운동 상태가 기록되어 있다."],
      ["🧲","힘","수레에 작용한 힘의 크기를 비교할 수 있다."],
      ["🧱","마찰","바닥과 바퀴 사이의 마찰을 무시할 수 없는 조건이다."],
      ["⏱️","측정","시간 측정에도 작은 오차가 존재한다."]
    ],
    hypotheses:[
      ["힘만 보면 충분하다",false],
      ["힘·질량·마찰·측정 오차를 분리해 확인해야 한다",true],
      ["측정값은 언제나 완벽하다",false]
    ],
    explain:"물리 실험에서는 모델에 포함한 요소와 실제 조건의 차이를 확인해야 한다. 특히 마찰이나 측정 오차처럼 처음에는 작아 보이는 요소가 결과에 영향을 줄 수 있다.",
    experiment:"가상 수레에서 힘과 질량, 마찰 조건을 바꾸고 운동 결과를 비교한다."
  },
  {
    id:"phys-bridge", lab:"물리", icon:"🌉", year:"파동", title:"공진을 찾아라",
    intro:"작은 반복 운동을 가했는데 구조물의 움직임이 특정 조건에서 크게 증가했다. 연구팀은 진동수와 고유 진동수를 비교한다.",
    clues:[
      ["〰️","진동수","외부에서 가한 반복 운동의 빈도를 측정했다."],
      ["📐","구조","구조물마다 잘 흔들리는 고유한 진동 특성이 있다."],
      ["📈","진폭","특정 조건에서 진폭이 크게 증가했다."],
      ["🔁","반복","같은 조건에서 비슷한 현상이 반복되었다."]
    ],
    hypotheses:[
      ["진동수와 상관없이 항상 같은 크기로 움직인다",false],
      ["외부 진동과 고유 진동 특성이 가까워지며 진폭이 커질 수 있다",true],
      ["반복 운동은 구조물에 영향을 줄 수 없다",false]
    ],
    explain:"공진은 외부에서 반복적으로 가해지는 진동의 조건이 계의 고유 진동 특성과 맞아떨어질 때 진폭이 크게 증가할 수 있는 현상이다.",
    experiment:"가상 진동판에서 외부 진동수를 조절해 진폭 그래프의 변화를 관찰한다."
  }
];

const LABS = [
  {id:"eng",name:"공학 연구실",icon:"⚙️",desc:"구조·시스템·설계 사건을 조사합니다."},
  {id:"chem",name:"화학 연구실",icon:"🧪",desc:"물질·공정·에너지 변화를 분석합니다."},
  {id:"bio",name:"생물 연구실",icon:"🧬",desc:"세포·유전자·생태계의 원인을 조사합니다."},
  {id:"phys",name:"물리 연구실",icon:"⚛️",desc:"힘·운동·파동·에너지의 관계를 검증합니다."}
];

let state = {
  screen:"home", caseId:null, clueFound:[], hypothesis:null, experiment:0,
  solved:JSON.parse(localStorage.getItem("failureLabSolved")||"[]"),
  level:Number(localStorage.getItem("failureLabLevel")||1),
  xp:Number(localStorage.getItem("failureLabXP")||0),
  challenge:JSON.parse(localStorage.getItem("failureLabChallenge")||"null")
};

function save(){
  localStorage.setItem("failureLabSolved",JSON.stringify(state.solved));
  localStorage.setItem("failureLabLevel",state.level);
  localStorage.setItem("failureLabXP",state.xp);
}
function xp(n){
  state.xp += n;
  const newLevel = Math.floor(state.xp/100)+1;
  if(newLevel>state.level){state.level=newLevel; toast("🎉 연구자 레벨이 올랐습니다!")}
  save(); renderHUD();
}
function toast(t){
  const el=document.getElementById("toast"); el.textContent=t; el.classList.remove("hidden");
  clearTimeout(window.toastTimer); window.toastTimer=setTimeout(()=>el.classList.add("hidden"),2200);
}
function renderHUD(){
  const el=document.querySelector(".hud"); if(!el)return;
  el.innerHTML=`<div class="pill">연구자 Lv.<b>${state.level}</b></div><div class="pill">XP <b>${state.xp}</b></div><div class="pill">해결 <b>${state.solved.length}/${CASES.length}</b></div>`;
}
function layout(content){
  document.getElementById("app").innerHTML=`
  <header class="topbar"><div class="logo">🔬</div><div class="brand"><b>실패 연구소</b><span>과학 사건 조사국</span></div><div class="spacer"></div><div class="hud"></div></header>
  ${content}`;
  renderHUD();
}
function goHome(){state.screen="home";render()}
function render(){
  if(state.screen==="home") return renderHome();
  if(state.screen==="map") return renderMap();
  if(state.screen==="cases") return renderCases();
  if(state.screen==="incident") return renderIncident();
  if(state.screen==="hypothesis") return renderHypotheses();
  if(state.screen==="experiment") return renderExperiment();
  if(state.screen==="report") return renderReport();
  if(state.screen==="challenge") return renderChallenge();
  if(state.screen==="about") return renderAbout();
}
function renderHome(){
  layout(`<main class="screen">
    <section class="hero"><div class="big">🔬</div><h1>실패 연구소</h1><p>사건이 발생했습니다. 정답을 찍는 대신, 현장을 조사하고 단서를 모아 가설을 세운 뒤 실험으로 검증하세요.</p>
    <div class="actions"><button class="btn primary" onclick="state.screen='map';render()">🧑‍🔬 연구소 입장</button><button class="btn" onclick="state.screen='cases';render()">📁 사건 목록</button><button class="btn" onclick="state.screen='challenge';render()">⚡ 챌린지</button></div></section>
    <div class="map-wrap"><div class="panel"><h2>게임 진행</h2><p>① 중앙 연구소에서 이동 → ② 사건 선택 → ③ 현장 단서 조사 → ④ 가설 선택 → ⑤ 연구실 실험 → ⑥ 최종 보고서 작성.</p><p>현재 버전은 하나의 HTML 파일로 실행되며, 진행 상황은 이 브라우저에 저장됩니다.</p></div>
    <div class="panel"><h2>현재 기록</h2><p>해결 사건: <b>${state.solved.length}</b> / ${CASES.length}</p><p>연구자 레벨: <b>${state.level}</b></p><button class="btn ghost" onclick="resetSave()">저장 초기화</button></div></div>
  </main>`);
}
function renderMap(){
  layout(`<main class="screen"><div class="case-head"><button class="btn ghost" onclick="goHome()">← 홈</button><h1>연구소 캠퍼스</h1><span class="tag">방향키 / WASD로 연구원 이동</span></div>
  <div class="map-wrap" style="margin-top:16px"><div><div class="map" id="map">
    <div class="map-title">CENTRAL RESEARCH INSTITUTE</div>
    <button class="room r1" onclick="openLab('eng')"><div>⚙️</div><h3>공학 연구실</h3><p>구조·설계·시스템 사건</p></button>
    <button class="room r2" onclick="openLab('chem')"><div>🧪</div><h3>화학 연구실</h3><p>물질·공정·에너지 사건</p></button>
    <button class="room r3" onclick="openLab('bio')"><div>🧬</div><h3>생물 연구실</h3><p>세포·유전자·생태계 사건</p></button>
    <button class="room r4" onclick="openLab('phys')"><div>⚛️</div><h3>물리 연구실</h3><p>힘·운동·파동·에너지 사건</p></button>
    <div class="center">🏢<br>중앙 연구동<br><small>사건 브리핑</small></div><div class="player" id="player">🧑‍🔬</div>
    <div class="map-note">연구실을 클릭하거나 연구원을 움직여 탐색하세요.</div>
  </div>
  <div class="mobile-controls"><span></span><button class="btn" onclick="move(0,-1)">↑</button><span></span><button class="btn" onclick="move(-1,0)">←</button><button class="btn" onclick="move(0,1)">↓</button><button class="btn" onclick="move(1,0)">→</button></div></div>
  <aside class="side"><div class="panel"><h2>📣 사건 브리핑</h2><p>연구원장: “실패는 끝이 아니라 데이터야. 관찰하고, 가설을 세우고, 다시 검증해.”</p><button class="btn primary" onclick="state.screen='cases';render()">사건 파일 열기</button></div>
  <div class="panel"><h3>오늘의 임무</h3><p>아무 연구실이나 들어가 사건 하나를 선택하세요. 첫 사건은 타코마 내로우즈교를 추천합니다.</p></div></aside></div></main>`);
  window.px=50;window.py=50; document.onkeydown=e=>{const k=e.key.toLowerCase();if(["arrowup","w"].includes(k))move(0,-1);if(["arrowdown","s"].includes(k))move(0,1);if(["arrowleft","a"].includes(k))move(-1,0);if(["arrowright","d"].includes(k))move(1,0)};
}
function move(dx,dy){
  window.px=Math.max(8,Math.min(92,(window.px||50)+dx*2));
  window.py=Math.max(12,Math.min(88,(window.py||50)+dy*2));
  const p=document.getElementById("player");if(p){p.style.left=window.px+"%";p.style.top=window.py+"%"}
}
function openLab(lab){
  state.lab=lab;state.screen="cases";render();
}
function renderCases(){
  const selected=state.lab;
  const arr=selected?CASES.filter(c=>c.lab===LABS.find(x=>x.id===selected)?.name.replace(" 연구실","")):CASES;
  layout(`<main class="screen"><div class="case-head"><button class="btn ghost" onclick="state.screen='map';render()">← 연구소</button><h1>📁 사건 아카이브</h1><span class="tag">${selected?LABS.find(x=>x.id===selected).name:"전체 연구실"}</span></div>
  <div class="actions" style="justify-content:flex-start"><button class="btn" onclick="state.lab=null;render()">전체</button>${LABS.map(l=>`<button class="btn" onclick="state.lab='${l.id}';render()">${l.icon} ${l.name}</button>`).join("")}</div>
  <div class="case-grid">${arr.map(c=>`<button class="case-card" onclick="startCase('${c.id}')"><small>${c.icon} ${c.lab} · ${c.year}</small><h3>${c.title}</h3><span>${state.solved.includes(c.id)?"✅ 해결 완료":"🔎 조사 가능"}</span></button>`).join("")}</div>
  </main>`);
}
function startCase(id){state.caseId=id;state.clueFound=[];state.hypothesis=null;state.experiment=0;state.screen="incident";render()}
function renderIncident(){
  const c=CASES.find(x=>x.id===state.caseId);
  if(!c)return goHome();
  const found=state.clueFound.length;
  layout(`<main class="screen"><div class="case-head"><button class="btn ghost" onclick="state.screen='cases';render()">← 사건 목록</button><h1>${c.icon} ${c.title}</h1><span class="tag">${c.lab} · ${c.year}</span></div>
  <div class="incident"><section class="box"><h2>현장 브리핑</h2><p>${c.intro}</p><div class="progress"><i style="width:${found/c.clues.length*100}%"></i></div><p>단서 ${found}/${c.clues.length}</p><div class="clues">${c.clues.map((x,i)=>`<button class="clue ${state.clueFound.includes(i)?"found":""}" onclick="findClue(${i})"><b>${x[0]} ${x[1]} ${state.clueFound.includes(i)?"✓":""}</b><span>${state.clueFound.includes(i)?x[2]:"조사하려면 클릭"}</span></button>`).join("")}</div></section>
  <aside class="box"><h2>💬 연구원 메모</h2><p>“단서 하나만 보고 결론을 내리지 말자. 서로 다른 관찰이 같은 가설을 지지하는지 확인하자.”</p>${found===c.clues.length?`<button class="btn primary" onclick="showHypotheses()">가설 회의 시작 →</button>`:"<p>모든 단서를 조사하면 가설을 세울 수 있습니다.</p>"}</aside></div></main>`);
}
function findClue(i){if(!state.clueFound.includes(i)){state.clueFound.push(i);xp(5)}render()}
function showHypotheses(){state.screen="hypothesis";renderHypotheses()}
function renderHypotheses(){
  const c=CASES.find(x=>x.id===state.caseId);
  layout(`<main class="screen"><div class="case-head"><button class="btn ghost" onclick="state.screen='incident';render()">← 현장</button><h1>🧠 가설 회의</h1><span class="tag">단서 ${state.clueFound.length}/${c.clues.length}</span></div>
  <div class="box" style="margin-top:18px"><h2>현재 증거를 가장 잘 설명하는 가설은?</h2><p>정답을 맞히는 것보다 “왜 이 가설을 선택했는가”를 생각하는 것이 중요합니다.</p><div class="hypotheses">${c.hypotheses.map((h,i)=>`<button class="hyp ${state.hypothesis===i?"selected":""}" onclick="selectHyp(${i})">${h[0]}</button>`).join("")}</div>
  ${state.hypothesis!==null?`<div class="result ${c.hypotheses[state.hypothesis][1]?"good":"bad"}">${c.hypotheses[state.hypothesis][1]?"🟢 이 가설은 증거와 잘 맞습니다.":"🟠 아직 설명하지 못하는 단서가 있습니다."}<br><small>이제 실험으로 확인해 봅시다.</small></div><div class="actions" style="justify-content:flex-start"><button class="btn primary" onclick="state.screen='experiment';render()">연구실에서 검증 →</button></div>`:""}</div></main>`);
}
function selectHyp(i){state.hypothesis=i;xp(10);renderHypotheses()}
function renderExperiment(){
  const c=CASES.find(x=>x.id===state.caseId);
  const n=state.experiment;
  layout(`<main class="screen"><div class="case-head"><button class="btn ghost" onclick="state.screen='hypothesis';render()">← 가설</button><h1>🧪 ${c.lab} 검증 실험</h1></div>
  <div class="box" style="margin-top:18px"><h2>가상 실험</h2><p>${c.experiment}</p><div class="experiment"><div class="panel"><h3>실험 조건</h3><p>버튼을 누를 때마다 관찰 데이터를 하나씩 수집합니다.</p><button class="btn primary" onclick="runExperiment()">데이터 수집 ${n<3?"▶":"완료"}</button></div><div class="panel"><h3>관찰값</h3><div class="readout">${n}/3</div><div class="meter"><i style="width:${n/3*100}%"></i></div><p>${n===0?"아직 측정하지 않았습니다.":n===1?"첫 번째 경향을 확인했습니다.":n===2?"반복 관찰로 경향이 더 분명해졌습니다.":"세 번의 관찰을 모았습니다."}</p></div></div>
  ${n>=3?`<div class="result good">✅ 실험 데이터가 모였습니다. 가설과 증거를 비교해 최종 결론을 작성하세요.</div><div class="actions" style="justify-content:flex-start"><button class="btn primary" onclick="state.screen='report';render()">최종 보고서 작성 →</button></div>`:""}</div></main>`);
}
function runExperiment(){state.experiment=Math.min(3,state.experiment+1);xp(8);renderExperiment()}
function renderReport(){
  const c=CASES.find(x=>x.id===state.caseId);
  const hyp=c.hypotheses[state.hypothesis]?.[0]||"선택하지 않음";
  const correct=c.hypotheses[state.hypothesis]?.[1];
  const already=state.solved.includes(c.id);
  if(!already && correct){state.solved.push(c.id);xp(30);save()}
  layout(`<main class="screen"><div class="case-head"><button class="btn ghost" onclick="state.screen='cases';render()">← 사건 목록</button><h1>📄 사건 조사 보고서</h1></div>
  <div class="box" style="margin-top:18px"><h2>${c.title}</h2><div class="report"><b>나의 가설</b><br>${hyp}<br><br><b>역사·과학적 해석</b><br>${c.explain}</div>
  <div class="result ${correct?"good":"bad"}">${correct?"🎉 사건 해결!":"🔎 가설을 다시 검토할 필요가 있습니다."}<br>${correct?"증거 → 가설 → 실험 → 결론의 조사 과정을 완료했습니다.":"실험 결과와 맞지 않는 부분을 찾아 다음 조사에서 수정해 보세요."}</div>
  <div class="actions"><button class="btn primary" onclick="state.screen='cases';render()">다른 사건 조사</button><button class="btn" onclick="state.screen='map';render()">연구소로 돌아가기</button></div></div></main>`);
}
function renderChallenge(){
  let ch=state.challenge;
  if(!ch){ch={order:shuffle(CASES.map(c=>c.id)),idx:0,score:0};state.challenge=ch}
  if(ch.idx>=ch.order.length){
    layout(`<main class="screen"><section class="hero"><div class="big">🏆</div><h1>챌린지 완료</h1><p>${ch.score} STEP을 연속으로 해결했습니다.</p><div class="actions"><button class="btn primary" onclick="state.challenge=null;render()">다시 도전</button><button class="btn" onclick="state.screen='home';state.challenge=null;render()">홈으로</button></div></section></main>`);return;
  }
  const c=CASES.find(x=>x.id===ch.order[ch.idx]);
  layout(`<main class="screen"><div class="case-head"><button class="btn ghost" onclick="state.challenge=null;state.screen='home';render()">나가기</button><h1>⚡ 챌린지</h1><span class="tag">STEP ${ch.score}</span></div>
  <div class="box" style="margin-top:18px"><small>${c.icon} ${c.lab} · ${c.year}</small><h2>${c.title}</h2><p>${c.intro}</p><div class="hypotheses">${c.hypotheses.map((h,i)=>`<button class="hyp" onclick="challengeAnswer(${h[1]},'${c.id}')">${h[0]}</button>`).join("")}</div></div></main>`);
}
function challengeAnswer(ok,id){
  if(ok){state.challenge.score++;state.challenge.idx++;xp(5);toast("✅ 다음 사건으로!");renderChallenge()}
  else {const score=state.challenge.score;state.challenge=null;layout(`<main class="screen"><section class="hero"><div class="big">🧭</div><h1>챌린지 종료</h1><p>${score} STEP에서 종료되었습니다. 틀린 가설도 다음 탐구의 데이터입니다.</p><div class="actions"><button class="btn primary" onclick="state.challenge={order:shuffle(CASES.map(c=>c.id)),idx:0,score:0};renderChallenge()">다시 도전</button><button class="btn" onclick="state.screen='home';render()">홈으로</button></div></section></main>`)}
}
function shuffle(a){return a.slice().sort(()=>Math.random()-.5)}
function renderAbout(){
  layout(`<main class="screen"><div class="case-head"><button class="btn ghost" onclick="goHome()">← 홈</button><h1>게임 설계</h1></div><div class="box" style="margin-top:18px"><h2>이 버전의 핵심</h2><p>기존 프로토타입의 ‘자유 탐구 / 챌린지 / 사건 카드 / 해결 기록’ 구조를 유지하면서, 실제 게임 루프를 ‘탐색 → 단서 → 가설 → 실험 → 보고서’로 확장했습니다.</p><h3>다음 확장 순서</h3><ol><li>현재 8개 사건을 50개 이상으로 확장</li><li>사건별 실제 현장 맵과 NPC 대화 추가</li><li>실험을 사건마다 다른 미니게임으로 교체</li><li>연구소 잠금 해제·연구자 레벨·배지 추가</li><li>결과 화면에서 ‘처음 가설 vs 최종 가설’ 비교</li><li>모바일 조작 개선</li></ol></div></main>`)
}
function resetSave(){if(confirm("이 브라우저의 게임 기록을 초기화할까요?")){localStorage.removeItem("failureLabSolved");localStorage.removeItem("failureLabLevel");localStorage.removeItem("failureLabXP");state.solved=[];state.level=1;state.xp=0;render()}}
renderHome();

document.addEventListener("click",e=>{
  if(e.target.matches("[data-about]")){state.screen="about";render()}
});
</script>
</body>
</html>
