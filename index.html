<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>실패 연구소</title>

    <style>
        body {
            margin: 0;
            background: #202733;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .container {
            max-width: 800px;
            margin: 100px auto;
            padding: 40px;
        }

        h1 {
            font-size: 48px;
        }

        .subtitle {
            font-size: 20px;
            color: #cbd5e1;
            margin-bottom: 40px;
        }

        button {
            padding: 16px 32px;
            font-size: 20px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.05);
        }

        #message {
            margin-top: 30px;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🔬 실패 연구소</h1>

        <p class="subtitle">
            과학 사건을 조사하고 원인을 밝혀내세요.
        </p>

        <button onclick="startGame()">
            연구 시작
        </button>

        <div id="message"></div>

    </div>

    <script>
        function startGame() {
            document.getElementById("message").textContent =
                "🧑‍🔬 연구소에 입장했습니다!";
        }
    </script>

</body>
</html>
