<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chem-Investigator: Case 01</title>
    <link rel="stylesheet" href="style.css">
    <!-- Three.js 및 OrbitControls CDN (서버 없이 바로 실행됨) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="canvas-container"></div>
    
    <!-- UI 오버레이 -->
    <div id="ui-layer">
        <header>
            <h1>CASE 01 : 플로지스톤의 모순 (1774)</h1>
            <p>목표: 주석(Sn) 가열 전후의 질량 수지(Mass Balance)를 규명하라.</p>
        </header>

        <aside class="control-panel">
            <div class="panel-section">
                <h3>센서 데이터 (Sensor Data)</h3>
                <div class="data-readout">
                    <span>현재 질량: </span>
                    <span id="mass-display" class="highlight">250.00 g</span>
                </div>
                <div class="data-readout">
                    <span>용기 상태: </span>
                    <span id="seal-display">개방됨 (Opened)</span>
                </div>
            </div>

            <div class="panel-section">
                <h3>공정 제어 (Process Control)</h3>
                <button id="btn-seal">밀폐 밸브 작동 (Toggle Seal)</button>
                <button id="btn-heat">가열 시작 (Ignite)</button>
                <button id="btn-reset">초기화 (Reset)</button>
            </div>

            <div class="panel-section" id="log-section">
                <h3>시스템 로그</h3>
                <ul id="system-log">
                    <li>[시스템] 장비 초기화 완료. 실험을 준비하십시오.</li>
                </ul>
            </div>
        </aside>
    </div>

    <script src="app.js"></script>
</body>
</html>
